# The fork's mobile app follows trunk from the operator's own servers. Every push that can change the app either
# publishes an over-the-air update to the installed build (the native layer is unchanged) or builds, signs and
# releases a new APK (it changed). Expo's fingerprint of the native layer decides which; a release is tagged with it.
name: fiu mobile
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/fiu-mobile.yaml"
  workflow_dispatch:

concurrency:
  group: fiu-mobile
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # Creates the APK release when the native layer changed.
      contents: write
    env:
      # Selects the fork's identity and update server in apps/mobile/app.config.ts.
      FIU_VARIANT: fiu
      FIU_OTA_URL: ${{ vars.FIU_OTA_URL }}
      FIU_OTA_APP_ID: ${{ vars.FIU_OTA_APP_ID }}
      # The fork reports to no Sentry project.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: $/tooling/github/setup

      - name: Fingerprint the native layer
        id: fp
        working-directory: apps/mobile
        run: |
          hash=$(npx expo-updates fingerprint:generate --platform android | jq -r .hash)
          tag="mobile-${hash:0:12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "a build for $tag exists: publishing an update"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "no build for $tag: building an APK"
          fi

      # Same native layer as a released build: ship the JavaScript over the air.
      - name: Publish an update
        if: steps.fp.outputs.build == 'false'
        working-directory: apps/mobile
        env:
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
          RELEASE_CHANNEL: trunk
        run: npx -y eoas@3.2.7 publish --branch trunk --platform android --nonInteractive --message "${GITHUB_SHA::12}"

      # A new native layer: build, sign with the fork's key and release the APK the phone installs.
      - uses: actions/setup-java@v4.8.0
        if: steps.fp.outputs.build == 'true'
        with:
          java-version: "17"
          distribution: temurin
      - uses: android-actions/setup-android@v3.2.2
        if: steps.fp.outputs.build == 'true'
        with:
          packages: "platform-tools"
      - name: Build the APK
        if: steps.fp.outputs.build == 'true'
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          (cd android && ./gradlew assembleRelease --no-daemon)
      - name: Sign and release
        if: steps.fp.outputs.build == 'true'
        working-directory: apps/mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAG: ${{ steps.fp.outputs.tag }}
        run: |
          set -eu
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias fiu \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$RUNNER_TEMP/karakeep-fiu.apk" android/app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/release.p12"
          "$tools/apksigner" verify "$RUNNER_TEMP/karakeep-fiu.apk"
          gh release create "$TAG" "$RUNNER_TEMP/karakeep-fiu.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Karakeep fiu ($TAG)" --latest \
            --notes "Native build for fingerprint $TAG. Later trunk changes reach it over the air until the native layer changes again."
